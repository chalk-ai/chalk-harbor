[project]
name = "chalk-harbor"
version = "0.1.0"
description = "Run Harbor benchmark trials in Chalk sandboxes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "chalkcompute>=2.13",
    "dockerfile-parse>=2.0",
    "harbor>=0.23",
]

[project.urls]
Homepage = "https://github.com/chalk-ai/chalk-harbor"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chalk_harbor"]
